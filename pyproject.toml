[project]
name = "oracle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arturo Jiménez de los Galanes Reguillos", email = "ajimenez78@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.120",
    "dotenv>=0.9.9",
    "gradio>=6.30.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.28.0",
]

[project.scripts]
